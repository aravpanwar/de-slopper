[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "de-slopper"
version = "0.1.0"
description = "Turns messy human code into professional code."
requires-python = ">=3.11"
dependencies = [
    "libcst>=1.1",
    "beautifulsoup4>=4.12",
    "markdown>=3.5",
    "pytest>=8",
]

[project.optional-dependencies]
screenshot = ["playwright"]

[project.scripts]
de-slopper = "deslopper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deslopper = ["tells.toml", "prompts/*.md"]

[tool.pytest.ini_options]
markers = ["browser: needs a real browser through playwright"]
testpaths = ["tests"]
pythonpath = ["src"]
